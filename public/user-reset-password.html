<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تنظیم گذرواژه جدید | وکیل‌یار</title>
<style>
:root{--n:#14233f;--g:#c9a45c;--bg:#f5f3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Tahoma,Arial;color:var(--n);line-height:1.9}main{max-width:520px;margin:35px auto;padding:24px;background:#fff;border:1px solid #e8e0d2;border-radius:16px;box-shadow:0 8px 30px #14233f12}h1{margin-top:0}p{color:#596579}label{display:block;margin:12px 0 5px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #cbd1dc;border-radius:8px;font:inherit}button{background:var(--n);color:#fff;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer;margin-top:16px;width:100%}button:disabled{opacity:.6}#msg{padding:12px;background:#f7f6f2;border-radius:8px;min-height:40px}.links a{color:var(--n)}
</style></head><body><main><h1>انتخاب گذرواژه جدید</h1>
<p>گذرواژه جدید باید حداقل ۱۰ نویسه داشته باشد. پس از تغییر، همه نشست‌های قبلی حساب از اعتبار خارج می‌شوند.</p>
<form id="reset"><label for="password">گذرواژه جدید</label><input id="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required><label for="confirm">تکرار گذرواژه جدید</label><input id="confirm" type="password" minlength="10" maxlength="200" autocomplete="new-password" required><button id="submit">ثبت گذرواژه جدید</button></form>
<p id="msg" role="status" aria-live="polite"></p><p class="links"><a href="/user-login.html">بازگشت به ورود</a></p></main>
<script>
const form=document.getElementById("reset"),msg=document.getElementById("msg"),button=document.getElementById("submit"),token=new URLSearchParams(location.search).get("token")||"";
if(!/^[a-f0-9]{64}$/.test(token)){form.hidden=true;msg.textContent="پیوند بازیابی معتبر نیست. از صفحه ورود درخواست پیوند تازه بدهید.";}
form.onsubmit=async e=>{e.preventDefault();if(form.password.value!==form.confirm.value){msg.textContent="دو گذرواژه یکسان نیستند.";return;}button.disabled=true;msg.textContent="در حال تغییر گذرواژه...";
try{const r=await fetch("/api/users/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({token,password:form.password.value})});const d=await r.json();msg.textContent=d.message||d.error||"نتیجه نامشخص";if(r.ok){form.reset();history.replaceState(null,"",location.pathname);}}
catch{msg.textContent="ارتباط با سرور برقرار نشد. دوباره تلاش کنید."}finally{button.disabled=false}};
</script></body></html>
