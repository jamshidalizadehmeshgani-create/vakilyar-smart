<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود وکیل | وکیل‌یار</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f4f2ed;color:#17243d;margin:0;padding:20px}main{max-width:480px;margin:8vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 28px #14233f12}h1{color:#14233f}p{line-height:1.9;color:#586174}label{display:block;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd2dc;border-radius:8px;font:inherit}button{width:100%;border:0;border-radius:8px;padding:13px;margin-top:18px;font:inherit;background:#20375d;color:white}.password-wrap{display:flex;align-items:center;gap:6px}.password-wrap input{flex:1;min-width:0}.password-toggle{width:auto;flex:0 0 48px;margin:0;padding:10px 8px;background:#f0eadf;color:#17243d;border:1px solid #ccd2dc;border-radius:8px;cursor:pointer}#msg{margin-top:14px;line-height:1.8}
</style></head><body><main><h1>ورود اختصاصی وکیل</h1><p>ورود فقط برای حساب‌هایی امکان‌پذیر است که مدیر سامانه ایجاد کرده و دسترسی آن‌ها را فعال کرده باشد.</p>
<form id="form"><label for="email">ایمیل</label><input id="email" type="email" autocomplete="username" maxlength="190" autocapitalize="none" spellcheck="false" required><label for="password">رمز عبور</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" maxlength="200" required><button class="password-toggle" type="button" id="togglePassword" aria-label="نمایش رمز عبور" aria-pressed="false" title="نمایش رمز عبور">👁</button></div><button><span aria-hidden="true">↪</span> ورود امن</button></form><div id="msg" role="status" aria-live="polite"></div></main>
<script>
const passwordField=document.getElementById("password");
const passwordToggle=document.getElementById("togglePassword");
passwordToggle.addEventListener("click",()=>{const reveal=passwordField.type==="password";passwordField.type=reveal?"text":"password";passwordToggle.textContent=reveal?"🙈":"👁";passwordToggle.setAttribute("aria-pressed",String(reveal));passwordToggle.setAttribute("aria-label",reveal?"مخفی‌کردن رمز عبور":"نمایش رمز عبور");passwordToggle.title=reveal?"مخفی‌کردن رمز عبور":"نمایش رمز عبور";});
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget;const button=form.querySelector("button");const msg=document.getElementById("msg");msg.textContent="در حال بررسی...";button.disabled=true;try{const r=await fetch("/api/lawyer/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});const d=await r.json();msg.textContent=d.message||d.error||"پاسخ نامشخص";if(r.ok)location.href="/lawyer-panel.html";}catch{msg.textContent="ارتباط با سرور برقرار نشد.";}finally{button.disabled=false;}});
</script></body></html>
