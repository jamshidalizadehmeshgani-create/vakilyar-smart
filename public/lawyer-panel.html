<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل وکیل | وکیل‌یار</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f4f2ed;color:#17243d;margin:0;padding:20px}main{max-width:760px;margin:6vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 28px #14233f12}h1{color:#14233f}.card{background:#f5f3ee;padding:16px;border-radius:10px;line-height:2}.muted{color:#667085;font-size:13px;line-height:1.9}button{border:0;border-radius:8px;padding:11px 16px;margin-top:16px;font:inherit;background:#20375d;color:white}
.question{border-top:1px solid #d8dce4;padding:14px 0;line-height:2}.question textarea{box-sizing:border-box;width:100%;min-height:90px;padding:10px;font:inherit;border:1px solid #ccd2dc;border-radius:8px}.answer{background:#fff;padding:10px;border-radius:8px;margin:8px 0;line-height:1.9}</style></head><body><main><h1>پنل اختصاصی وکیل</h1><div id="state" class="card">در حال بررسی نشست امن...</div><section><h2>پرسش‌های ارجاع‌شده</h2><div id="questions" class="card" aria-live="polite">در حال دریافت پرسش‌ها...</div></section><button id="logout" hidden>خروج امن از حساب</button><p class="muted">دسترسی وکیل در هر درخواست از سمت سرور کنترل می‌شود.</p></main>
<script>const state=document.getElementById("state"),btn=document.getElementById("logout"),box=document.getElementById("questions");
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
async function loadQuestions(){const r=await fetch("/api/lawyer/questions",{credentials:"same-origin",cache:"no-store"});const d=await r.json();if(!r.ok){box.textContent=d.error||"دریافت پرسش‌ها ممکن نیست.";return;}box.replaceChildren();if(!d.questions.length){box.textContent="هنوز پرسشی برای شما ارسال نشده است.";return;}for(const q of d.questions){const card=el("article","question");card.append(el("strong","","وضعیت: "+(q.status==="answered"?"پاسخ داده‌شده":"در انتظار پاسخ")),el("p","",q.question),el("small","muted","شناسه: "+q.id+" | "+q.created_at));for(const a of (q.replies||[]))card.append(el("div","answer","پاسخ: "+a.message));const area=el("textarea");area.placeholder="متن پاسخ را وارد کنید...";const pendingKey="vy_pending_reply_"+q.id;let pendingReply=null;try{const saved=sessionStorage.getItem(pendingKey);if(saved){const parsed=JSON.parse(saved);if(parsed&&/^[a-f0-9]{32}$/.test(parsed.id||"")&&typeof parsed.message==="string"){pendingReply=parsed;area.value=parsed.message;}else sessionStorage.removeItem(pendingKey);}}catch{}const send=el("button","","ثبت پاسخ");const feedback=el("p","muted","");feedback.setAttribute("role","status");feedback.setAttribute("aria-live","polite");feedback.setAttribute("aria-atomic","true");send.onclick=async()=>{const message=area.value.trim();if(message.length<2){feedback.textContent="متن پاسخ را وارد کنید.";return;}if(pendingReply&&pendingReply.message!==message){feedback.textContent="نتیجه ارسال قبلی هنوز مشخص نیست. برای جلوگیری از ثبت پاسخ تکراری، همان متن قبلی را دوباره ارسال کنید.";return;}if(!pendingReply){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);pendingReply={id:Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join(""),message};try{sessionStorage.setItem(pendingKey,JSON.stringify(pendingReply));}catch{feedback.textContent="ذخیره شناسه امن عملیات ممکن نیست؛ پاسخ ارسال نشد.";return;}}send.disabled=true;feedback.textContent="در حال ارسال پاسخ...";try{const rr=await fetch("/api/lawyer/reply",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({question_id:q.id,message,request_id:pendingReply.id})});const dd=await rr.json();feedback.textContent=dd.message||dd.error||"نتیجه نامشخص";if(rr.ok||rr.status<500){pendingReply=null;try{sessionStorage.removeItem(pendingKey);}catch{}}if(rr.ok)loadQuestions();}catch{feedback.textContent="ارتباط با سرور برقرار نشد. همان متن را دوباره ارسال کنید تا پاسخ تکراری ثبت نشود.";}finally{send.disabled=false;}};card.append(area,send,feedback);box.append(card);}}
(async()=>{try{const r=await fetch("/api/lawyer/me",{credentials:"same-origin",cache:"no-store"});const d=await r.json();if(!r.ok){state.textContent=d.error||"نشست معتبر نیست.";setTimeout(()=>location.href="/lawyer-login.html",1400);return;}state.textContent="خوش آمدید، "+d.lawyer.name+"؛ حساب شما فعال است.\nشناسه: "+d.lawyer.id+"\nایمیل: "+d.lawyer.email;btn.hidden=false;await loadQuestions();}catch{state.textContent="ارتباط با سرور برقرار نشد.";}})();
btn.onclick=async()=>{try{await fetch("/api/lawyer/logout",{method:"POST",credentials:"same-origin"});}finally{location.href="/lawyer-login.html";}};</script></body></html>
