name: Tests

on:
  pull_request:
    branches: [main, feat/vakilyar-pwa-install]
  push:
    branches: [feat/verified-iran-lease-law-context]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
