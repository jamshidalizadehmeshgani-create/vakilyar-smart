name: Validate VakilYar

on:
  pull_request:
  push:
    branches:
      - main
      - feature/volume-credits-pro-gating

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate package and Vercel configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Check all API and library JavaScript syntax
        run: |
          find api handlers lib -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Run security and quota unit tests
        run: node --test tests/*.test.js
      - name: Validate deployed public page inline scripts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const required = new Set(['public/admin-credits.html', 'public/admin-lawyers.html', 'public/index.html', 'public/user-login.html', 'public/user-forgot-password.html', 'public/user-reset-password.html']);
          const files = [...required, 'public/ask-lawyer.html', 'public/lawyer-login.html', 'public/lawyer-panel.html'];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [];
          const executableTypes = new Set(['module', 'text/javascript', 'application/javascript', 'text/ecmascript', 'application/ecmascript']);
          let rest = html;
          while (true) {
            const start = rest.indexOf('<script');
            if (start < 0) break;
            const openEnd = rest.indexOf('>', start);
            const close = rest.indexOf('</script>', openEnd);
            if (openEnd < 0 || close < 0) throw new Error('Malformed script tag in ' + file);
            const openingTag = rest.slice(start, openEnd + 1);
            const typeMatch = openingTag.match(/\\btype\\s*=\\s*["']([^"']+)["']/i);
            const type = typeMatch ? typeMatch[1].trim().toLowerCase() : '';
            const body = rest.slice(openEnd + 1, close);
            // JSON-LD, import maps, and other data blocks are not executable JavaScript.
            if (!type || executableTypes.has(type)) scripts.push(body);
            rest = rest.slice(close + 9);
          }
          if (required.has(file) && !scripts.length) throw new Error('No executable inline script found in ' + file);
          scripts.forEach(script => new Function(script));
          console.log(file + ': ' + scripts.length + ' executable inline script(s) valid');
          }
          NODE
