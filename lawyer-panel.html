<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل وکیل | وکیل‌یار</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f4f2ed;color:#17243d;margin:0;padding:20px}main{max-width:760px;margin:6vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 28px #14233f12}h1{color:#14233f}.card{background:#f5f3ee;padding:16px;border-radius:10px;line-height:2}.muted{color:#667085;font-size:13px;line-height:1.9}button{border:0;border-radius:8px;padding:11px 16px;margin-top:16px;font:inherit;background:#20375d;color:white}
</style></head><body><main><h1>پنل اختصاصی وکیل</h1><div id="state" class="card">در حال بررسی نشست امن...</div><button id="logout" hidden>خروج امن از حساب</button><p class="muted">در این نسخه، ورود امن و کنترل وضعیت حساب فراهم شده است. بخش دریافت و پاسخ‌گویی به پرسش‌های کاربران در مرحله بعد به سامانه گفت‌وگو متصل خواهد شد.</p></main>
<script>
(async()=>{const state=document.getElementById("state"),btn=document.getElementById("logout");try{const r=await fetch("/api/lawyer/me",{credentials:"same-origin",cache:"no-store"});const d=await r.json();if(!r.ok){state.textContent=d.error||"نشست معتبر نیست.";setTimeout(()=>location.href="/lawyer-login.html",1400);return;}state.textContent="خوش آمدید، "+d.lawyer.name+"؛ حساب شما فعال است.\nشناسه اختصاصی: "+d.lawyer.id+"\nایمیل: "+d.lawyer.email;btn.hidden=false;}catch{state.textContent="ارتباط با سرور برقرار نشد.";}})();
document.getElementById("logout").onclick=async()=>{try{await fetch("/api/lawyer/logout",{method:"POST",credentials:"same-origin"});}finally{location.href="/lawyer-login.html";}};
</script></body></html>
